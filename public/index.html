<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Web Proxy</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101114;color:#eee}
    header{height:58px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#191b20;border-bottom:1px solid #2b2e35}
    button{border:0;border-radius:9px;background:#2a2d34;color:#fff;padding:9px 12px;font-size:16px;cursor:pointer}
    button:hover{background:#353942}
    #url{flex:1;min-width:0;border:1px solid #343841;border-radius:10px;background:#0e0f12;color:#fff;padding:10px 13px;font-size:15px;outline:none}
    #url:focus{border-color:#6d7482}
    #go{background:#fff;color:#111;font-weight:700}
    iframe{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#fff}
    .note{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:520px;text-align:center;color:#9da3af;pointer-events:none}
  </style>
</head>
<body>
  <header>
    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reload" title="Reload">↻</button>
    <input id="url" autocomplete="off" placeholder="Enter a website, e.g. example.com">
    <button id="go">Go</button>
  </header>
  <div class="note" id="note">Enter a URL above to browse through your personal proxy.</div>
  <iframe id="view" title="Proxied website"></iframe>

<script>
const url = document.getElementById("url");
const view = document.getElementById("view");
const note = document.getElementById("note");

function go() {
  let value = url.value.trim();
  if (!value) return;
  if (!/^https?:\/\//i.test(value)) value = "https://" + value;
  try {
    const absolute = new URL(value).href;
    view.src = "/proxy?url=" + encodeURIComponent(absolute);
    url.value = absolute;
    note.style.display = "none";
  } catch {
    alert("Please enter a valid website URL.");
  }
}

document.getElementById("go").onclick = go;
url.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
document.getElementById("reload").onclick = () => { if (view.src) view.src = view.src; };
document.getElementById("back").onclick = () => {
  try { view.contentWindow.history.back(); } catch {}
};
document.getElementById("forward").onclick = () => {
  try { view.contentWindow.history.forward(); } catch {}
};
</script>
</body>
</html>
